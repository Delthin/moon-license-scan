name: Native builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  # The CDN expires this pin on 2027-01-17 UTC; renew the version and hashes together.
  MOONBIT_VERSION: "0.10.21+06da1ed44"
  CORE_TAR_SHA256: 358728a14c7bbb5d1861fb48845cd1785da495b7b1836e484af499a679e328c2
  CORE_ZIP_SHA256: 9dee22c988998e41c6b39dfeacca3f354d6ac9da2159afd9f9d9853bcad1cc36
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            toolchain: moonbit-linux-x86_64.tar.gz
            sha256: 32f74e33538911313acba366d4a06e7678296aa7737945f678ff1fbc7f9f7f82
          - os: macos-15
            platform: macos-arm64
            toolchain: moonbit-darwin-aarch64.tar.gz
            sha256: 8c75c8413fa5427420baa9341fe980ee2f13df8f1b157536cd612f764b038aeb
          - os: windows-2025
            platform: windows-x64
            toolchain: moonbit-windows-x86_64.zip
            sha256: 941b6596813861350d43e2fc92b4444f562f2b5589b07c1b82e5c62f07f47239
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified MoonBit toolchain
        shell: pwsh
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          TOOLCHAIN_SHA256: ${{ matrix.sha256 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $cdn = 'https://cli.moonbitlang.com'
          $version = [Uri]::EscapeDataString($env:MOONBIT_VERSION)
          $env:MOON_HOME = Join-Path $env:RUNNER_TEMP 'moonbit'
          $lib = Join-Path $env:MOON_HOME 'lib'
          New-Item -ItemType Directory -Path $lib -Force | Out-Null

          function Install-Archive($url, $sha256, $destination) {
            $archive = Join-Path $env:RUNNER_TEMP ($url.Split('/')[-1])
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 2 --connect-timeout 15 --max-time 180 --output $archive $url
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $sha256) {
              throw "SHA-256 mismatch: $url"
            }
            if ($IsWindows) {
              Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
            } else {
              tar -xf $archive -C $destination
            }
          }

          Install-Archive "$cdn/binaries/$version/$env:TOOLCHAIN" $env:TOOLCHAIN_SHA256 $env:MOON_HOME
          if ($IsWindows) {
            Install-Archive "$cdn/cores/core-$version.zip" $env:CORE_ZIP_SHA256 $lib
          } else {
            Install-Archive "$cdn/cores/core-$version.tar.gz" $env:CORE_TAR_SHA256 $lib
          }
          $bin = Join-Path $env:MOON_HOME 'bin'
          if (!$IsWindows) {
            Get-ChildItem -LiteralPath $bin -File | Where-Object Extension -ne '.wasm' | ForEach-Object { chmod +x $_.FullName }
            $tcc = Join-Path $bin 'internal/tcc'
            if (Test-Path -LiteralPath $tcc) { chmod +x $tcc }
          }
          $env:PATH = $bin + [IO.Path]::PathSeparator + $env:PATH
          moon -C (Join-Path $lib 'core') bundle --warn-list -a --all
          "MOON_HOME=$env:MOON_HOME" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH
      - run: moon version --all
      - run: moon update
      - run: moon check --target native
      - name: Check generated MoonBit interfaces
        if: runner.os == 'Linux'
        run: |
          moon info --target native
          git diff --exit-code -- ':(glob)**/pkg.generated.mbti'
      - run: moon test --target native
      - name: Verify extracted CLI, MCP, and Web
        run: moon run --target native scripts/package.mbtx -- dist ${{ matrix.platform }}
      - name: Verify independent SDK consumer
        run: moon run --target native scripts/sdk-smoke.mbtx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moon-license-scan-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Upload verified Mooncakes SDK
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moon-license-scan-sdk
          path: _build/verified-sdk/Delthin-moon_license_scan-*.zip
          if-no-files-found: error
